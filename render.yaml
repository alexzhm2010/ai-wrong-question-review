# Blueprint ai_wrong_question：此文件只定义单个 Web 服务。
# 服务名请勿随意变更：改名会让 Render 按新名字另建服务，并可能给 onrender.com 域名加上消歧后缀。
services:
  - type: web
    name: wrong_review
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    numInstances: 1
    # autoDeploy 已弃用，等价写法为 autoDeployTrigger: commit（每次推送 main 自动部署）
    autoDeployTrigger: commit
    healthCheckPath: /api/version
    envVars:
      # Supabase 连接串（Render 控制台手动填写，sync: false 表示不写入仓库）
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # 会话密钥：本项目使用 next-auth v4，只读取 NEXTAUTH_SECRET。
      # AUTH_SECRET / AUTH_TRUST_HOST 是 Auth.js v5 的变量，v4 会静默忽略。
      - key: NEXTAUTH_SECRET
        generateValue: true
      # 部署后按实际域名填写，例如 https://ai-wrong-question-review.onrender.com
      - key: NEXTAUTH_URL
        sync: false
      # 首个管理员由容器启动时 seed-admin 创建，生产环境务必设置强密码。
      # 未设置 ADMIN_PASSWORD 时会自动生成随机密码并打印到启动日志（仅显示一次）。
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # AI：通义千问 VL（OpenAI 兼容协议）
      - key: AI_PROVIDER
        value: "openai"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      - key: OPENAI_MODEL
        value: "qwen3-vl-plus"
      # 保活：进程内定时自请求，防止免费实例 15 分钟无访问后休眠
      # 600000ms = 10 分钟；如需更快可改为 15000（实际触发 11–19 秒）
      - key: KEEPALIVE_INTERVAL_MS
        value: "600000"
