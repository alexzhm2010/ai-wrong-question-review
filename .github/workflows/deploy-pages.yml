name: Deploy Static Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/prepare-pages.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-static
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run pages:build
        env:
          # 在仓库 Settings → Secrets and variables → Actions 中配置；
          # 不配置时 src/lib/supabase/config.ts 会回退到内置的项目地址。
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}

      - name: Publish out/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          # 只增不删：保留 _next/static 下带内容哈希的旧构建产物。
          # 若清空重发，缓存了旧 HTML 的客户端（iOS PWA、HTML 的 max-age 缓存期内）
          # 会去请求已删除的旧 chunk 得到 404，Next 直接抛
          # "Application error: a client-side exception"，整页白屏。
          # 旧文件体积小、文件名互不冲突，保留即可，代价只是静态目录缓慢增长。
          keep_files: true
          commit_message: 'chore: publish static build (GitHub Pages + Supabase)'
