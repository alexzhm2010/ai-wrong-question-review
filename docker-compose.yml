version: '3'

services:
  ai-wrong-review:
    image: ghcr.io/wttwins/wrong-notebook:latest
    container_name: ai-wrong-review
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Supabase 连接串（连接池 6543，迁移直连 5432）
      - DATABASE_URL=postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=1
      - DIRECT_URL=postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # next-auth v4 只读取 NEXTAUTH_SECRET（AUTH_SECRET 是 v5 变量，不会生效）
      - NEXTAUTH_SECRET=your_secret_key
      - NEXTAUTH_URL=http://localhost:3000
      # 首个管理员账号，生产环境请改成强密码
      - ADMIN_EMAIL=admin@localhost
      - ADMIN_PASSWORD=change-me-before-exposing
      # AI：通义千问 VL
      - AI_PROVIDER=openai
      - OPENAI_API_KEY=sk-xxxx
      - OPENAI_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - OPENAI_MODEL=qwen3-vl-plus
    volumes:
      # 仅用于保存应用版本标记与可选本地配置覆盖，数据库在 Supabase
      - ./config:/app/config
