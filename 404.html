<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在跳转…</title>
<script>
(function () {
  var base = '/ai-wrong-question-review/';
  var p = location.pathname;
  if (p.indexOf(base) !== 0) { location.replace(base); return; }
  var rel = p.slice(base.length).replace(/\/$/, '');
  var q = location.search || '';
  var m;
  if ((m = rel.match(/^error-items\/([^/]+)$/))) {
    location.replace(base + 'item/?id=' + encodeURIComponent(m[1]) + (q ? '&' + q.slice(1) : ''));
  } else if ((m = rel.match(/^notebooks\/([^/]+)\/add$/))) {
    location.replace(base + 'notebook/add/?id=' + encodeURIComponent(m[1]) + (q ? '&' + q.slice(1) : ''));
  } else if ((m = rel.match(/^notebooks\/([^/]+)$/))) {
    location.replace(base + 'notebook/?id=' + encodeURIComponent(m[1]) + (q ? '&' + q.slice(1) : ''));
  } else if ((m = rel.match(/^admin\/user\/([^/]+)$/))) {
    location.replace(base + 'admin/user/?id=' + encodeURIComponent(m[1]) + (q ? '&' + q.slice(1) : ''));
  } else {
    location.replace(base + (q || ''));
  }
})();
</script>
</head>
<body>正在跳转…</body>
</html>
